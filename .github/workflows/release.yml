name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build debug and signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Verify release signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for APK in app/build/outputs/apk/release/app-*-release.apk; do
            echo "Verifying $APK"
            "$APKSIGNER" verify --print-certs "$APK"
          done

      - name: Prepare release files
        run: |
          TAG="${GITHUB_REF_NAME}"
          rm -rf artifacts
          mkdir -p artifacts
          for APK in app/build/outputs/apk/debug/app-*-debug.apk; do
            NAME=$(basename "$APK")
            ABI=${NAME#app-}
            ABI=${ABI%-debug.apk}
            cp "$APK" "artifacts/ModulesManager-${TAG}-debug-${ABI}.apk"
          done
          for APK in app/build/outputs/apk/release/app-*-release.apk; do
            NAME=$(basename "$APK")
            ABI=${NAME#app-}
            ABI=${ABI%-release.apk}
            cp "$APK" "artifacts/ModulesManager-${TAG}-release-${ABI}.apk"
          done
          PREVIOUS=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREVIOUS" ]; then RANGE="${PREVIOUS}..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## Changes"
            git log --pretty=format:'- %s (`%h`)' "$RANGE"
            echo
            echo
            echo "## Downloads"
            echo "Each APK contains one CPU architecture. Most phones need the arm64-v8a build."
            echo
            echo "- \`ModulesManager-${TAG}-release-arm64-v8a.apk\`: signed, 64-bit ARM phones"
            echo "- \`ModulesManager-${TAG}-release-armeabi-v7a.apk\`: signed, 32-bit ARM phones"
            echo "- \`ModulesManager-${TAG}-release-x86_64.apk\`: signed, x86_64 emulators"
            echo "- \`ModulesManager-${TAG}-release-x86.apk\`: signed, x86 emulators"
            echo "- \`ModulesManager-${TAG}-debug-<abi>.apk\`: debug builds, one per architecture"
          } > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Modules Manager ${TAG}" --notes-file release-notes.md
            gh release upload "$TAG" artifacts/*.apk --clobber
          else
            gh release create "$TAG" \
              artifacts/*.apk \
              --title "Modules Manager ${TAG}" \
              --notes-file release-notes.md
          fi
